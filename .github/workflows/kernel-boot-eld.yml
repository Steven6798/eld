name: Linux Kernel Boot with ELD (riscv32)

# Build a riscv32 Linux kernel linked with ld.eld, package an ELD-linked
# BusyBox (fetched from busybox-eld.yml) into an initramfs, and boot it in
# qemu-system-riscv32 to confirm ELD can correctly link and run something as
# structurally complex as a kernel + real userspace.

on:
  workflow_dispatch:
  # pull_request: {} # Uncomment only to test this WF file update.
  schedule:
    - cron: "0 6 * * *"

permissions:
  contents: write
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_TAG: v7.1
  KERNEL_IMAGE: arch/riscv/boot/Image

jobs:
  kernel-boot-riscv32:
    # if: github.repository == 'qualcomm/eld'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout eld
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure workflow environment variables
        uses: ./.github/workflows/ConfigureBuildWorkflowENV

      - name: Record pre-build entry
        if: github.event_name == 'schedule'
        uses: ./.github/workflows/BuildStatusDataRecorder
        with:
          enabled: true
          project: "llvm-project/llvm/tools/eld"
          stage: "pre-"
          workflow-name: "kernel-boot"
          record-mode: "record"
          status: "fail"
          run-id: ${{github.run_id}}
          arch-name: "riscv32"
          branch-name: "${{env.BUILD_BRANCH}}"

      - name: Fetch latest nightly toolset
        uses: ./.github/workflows/FetchNightlyToolset

      - name: Install kernel build dependencies
        shell: bash
        run: |
          sudo apt update
          sudo apt install -y bison flex libssl-dev libelf-dev bc \
            qemu-system-misc cpio

      - name: Resolve busybox-eld.yml run id
        id: resolve_busybox
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const resp = await github.rest.actions.listWorkflowRuns({
              owner, repo,
              workflow_id: 'busybox-eld.yml',
              status: 'success',
              per_page: 1, // we only need the latest
            });
            const runs = resp.data.workflow_runs || [];
            if (runs.length === 0) {
              core.setFailed('No successful busybox-eld.yml run found.');
              return;
            }
            const run = runs[0];
            core.info(`Latest successful busybox-eld.yml run: id=${run.id}, run_number=${run.run_number}`);
            core.setOutput('run_id', String(run.id));

      - name: Download BusyBox binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: busybox-eld-riscv32
          run-id: ${{ steps.resolve_busybox.outputs.run_id }}
          github-token: ${{ github.token }}
          path: busybox-dl

      - name: Download clang-cross-riscv32 toolchain artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: clang-cross-riscv32
          run-id: ${{ steps.resolve_busybox.outputs.run_id }}
          github-token: ${{ github.token }}
          path: clang-cross

      - name: Extract clang-cross toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p clang-cross-extracted
          tar -xf clang-cross/clang-cross-*.tar -C clang-cross-extracted

      - name: Clone Linux kernel
        shell: bash
        run: |
          git clone --depth 1 --branch "${KERNEL_TAG}" \
            https://github.com/torvalds/linux.git

      - name: Configure kernel
        shell: bash
        run: |
          set -euo pipefail
          cd linux
          make ARCH=riscv rv32_defconfig
          ./scripts/config \
            --enable CONFIG_BLK_DEV_INITRD \
            --enable CONFIG_SOC_VIRT \
            --enable CONFIG_DEVTMPFS \
            --enable CONFIG_DEVTMPFS_MOUNT \
            --disable CONFIG_DEBUG_INFO \
            --disable CONFIG_GDB_SCRIPTS
          make ARCH=riscv olddefconfig

      - name: Build kernel with ELD
        shell: bash
        run: |
          set -euo pipefail
          command -v clang
          command -v ld.eld
          clang --version | head -1
          ld.eld --version | head -1

          # scripts/ld-version.sh (invoked by scripts/Kconfig.include during
          # the syncconfig that LLVM=1/LD=ld.eld triggers, since it differs
          # from the toolchain olddefconfig ran with) only recognizes "GNU
          # ld" and "LLD" by name and rejects anything else as "unknown
          # linker". ld.eld's --version output matches neither, so shim a
          # copy of ld.eld that reports itself as LLD for that single-arg
          # --version probe only; every other invocation (i.e. the real
          # link) execs straight through to the real ld.eld unmodified.
          shim_dir="${PWD}/kbuild-ld-eld-shim"
          mkdir -p "${shim_dir}"
          real_ld_eld="$(command -v ld.eld)"
          cat > "${shim_dir}/ld.eld" <<SHIM
          #!/bin/sh
          if [ "\$#" -eq 1 ] && [ "\$1" = "--version" ]; then
            echo "LLD \$(clang --version | head -1 | grep -o '[0-9.]*' | head -1) (\$(${real_ld_eld} --version | head -1)) (compatible with GNU linkers)"
            exit 0
          fi
          exec "${real_ld_eld}" "\$@"
          SHIM
          chmod +x "${shim_dir}/ld.eld"

          cd linux
          PATH="${shim_dir}:${PATH}" make -j"$(nproc)" \
            ARCH=riscv \
            CROSS_COMPILE=riscv32-unknown-linux-musl- \
            LLVM=1 \
            CC=clang \
            LD=ld.eld \
            "${KERNEL_IMAGE#arch/riscv/boot/}"

          # kbuild always records the exact last link command for a target
          # in a hidden .<target>.cmd file, independent of verbosity level.
          # Use that (rather than V=1, which would drown the log in every
          # intermediate compile command) to confirm ld.eld -- not the
          # default ld.lld -- actually produced vmlinux.
          if ! grep -q 'ld\.eld' .vmlinux.cmd; then
            echo "vmlinux was not linked with ld.eld (.vmlinux.cmd):" >&2
            cat .vmlinux.cmd >&2
            exit 1
          fi
          echo "Confirmed ld.eld linked vmlinux."

      - name: Build initramfs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x busybox-dl/busybox

          interp_path="$(readelf -p .interp busybox-dl/busybox | sed -n 's/^ *\[ *[0-9]*\] *//p')"
          if [[ -z "${interp_path}" ]]; then
            echo "Could not read PT_INTERP from downloaded busybox binary" >&2
            exit 1
          fi
          echo "BusyBox expects its dynamic linker at: ${interp_path}"

          musl_so="$(find clang-cross-extracted -type f -name 'ld-musl-riscv32.so.1' -print -quit)"
          if [[ -z "${musl_so}" ]]; then
            echo "Could not find ld-musl-riscv32.so.1 in the clang-cross-riscv32 toolchain" >&2
            exit 1
          fi
          musl_lib_dir="$(dirname "${musl_so}")"
          echo "Using musl runtime from: ${musl_lib_dir}"

          rm -rf initramfs
          mkdir -p initramfs/bin initramfs/proc initramfs/sys initramfs/dev initramfs/tmp
          mkdir -p "initramfs$(dirname "${interp_path}")"
          cp -a "${musl_lib_dir}"/. "initramfs$(dirname "${interp_path}")/"

          cp busybox-dl/busybox initramfs/bin/busybox
          for applet in sh mount echo cat grep mkdir ls poweroff; do
            ln -sf busybox "initramfs/bin/${applet}"
          done

          cat > initramfs/init <<'EOF'
          #!/bin/sh
          mount -t proc none /proc
          mount -t sysfs none /sys
          echo "KERNEL-BOOT-OK"
          mkdir -p /tmp/t && echo hello > /tmp/t/f && grep -q hello /tmp/t/f \
            && echo "SELFTEST-PASS" || echo "SELFTEST-FAIL"
          cat /proc/version
          poweroff -f
          EOF
          chmod +x initramfs/init

          ( cd initramfs && find . | cpio -o -H newc ) | gzip -9 > initramfs.cpio.gz

      - name: Boot kernel in QEMU
        shell: bash
        run: |
          set -euo pipefail
          timeout -k 1s 60s qemu-system-riscv32 \
            -M virt \
            -m 256M \
            -nographic \
            -no-reboot \
            -kernel "linux/${KERNEL_IMAGE}" \
            -initrd initramfs.cpio.gz \
            -append "console=ttyS0 rw" \
            > /tmp/kernel-boot-output.txt 2>&1 || true
          pkill -KILL -f "qemu-system-riscv32.*${KERNEL_IMAGE}" 2>/dev/null || true
          cat /tmp/kernel-boot-output.txt

      - name: Upload boot log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: kernel-boot-riscv32-log
          retention-days: 2
          path: /tmp/kernel-boot-output.txt

      - name: Validate boot log with FileCheck
        shell: bash
        run: |
          FileCheck --input-file=/tmp/kernel-boot-output.txt "${{ github.workspace }}/test/LinuxKernel/riscv32/test-failures.txt"

      - name: Update build entry
        if: success() && github.event_name == 'schedule'
        uses: ./.github/workflows/BuildStatusDataRecorder
        with:
          enabled: true
          project: "llvm-project/llvm/tools/eld"
          stage: "post-"
          workflow-name: "kernel-boot"
          record-mode: "update"
          status: "pass"
          run-id: ${{github.run_id}}
          arch-name: "riscv32"
          branch-name: "${{env.BUILD_BRANCH}}"

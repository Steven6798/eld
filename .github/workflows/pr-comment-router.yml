name: PR comment router
run-name: "PR comment router #${{ github.event.issue.number }}"

on:
  issue_comment:
    types: [created, edited]

concurrency:
  group: pr-comment-router-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  actions: read
  checks: write

jobs:
  validate:
    # Restore before merging upstream: github.repository == 'qualcomm/eld' &&
    # github.event.issue.pull_request != null
    if: github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.request.outputs.pr_number }}
      pr_sha: ${{ steps.request.outputs.pr_sha }}
      request_id: ${{ steps.request.outputs.request_id }}
      artifact_name: ${{ steps.request.outputs.artifact_name }}
      artifact_run_id: ${{ steps.request.outputs.artifact_run_id }}
      artifact_reused: ${{ steps.request.outputs.artifact_reused }}
      check_run_id: ${{ steps.request.outputs.check_run_id }}
    steps:
      - name: Validate comment request
        id: request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        with:
          github-token: ${{ github.token }}
          script: |
            const command = process.env.COMMENT_BODY.trim();
            const allowed = new Set(['COLLABORATOR', 'MEMBER', 'OWNER']);
            if (command !== 'check-llvm-test-suite' ||
                !allowed.has(context.payload.comment.author_association)) {
              core.info('Ignoring unrelated or unauthorized comment.');
              return;
            }

            const pullRequest = (await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            })).data;
            const requestId = `${context.issue.number}-${pullRequest.head.sha}-${context.payload.comment.id}`;
            const artifactName = `pr-eld-toolset-${pullRequest.head.sha}`;
            const buildWorkflow = await github.rest.actions.getWorkflow({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'build-pr-toolset.yml',
            });
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: artifactName,
                per_page: 100,
              }
            );
            let reusableArtifact;
            for (const artifact of artifacts) {
              const runId = artifact.workflow_run?.id;
              if (artifact.expired || !runId) {
                continue;
              }
              const run = await github.rest.actions.getWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });
              if (String(run.data.workflow_id) === String(buildWorkflow.data.id) &&
                  run.data.conclusion === 'success') {
                reusableArtifact = artifact;
                break;
              }
            }

            core.setOutput('pr_number', String(context.issue.number));
            core.setOutput('pr_sha', pullRequest.head.sha);
            core.setOutput('request_id', requestId);
            core.setOutput('artifact_name', artifactName);
            core.setOutput('artifact_run_id', reusableArtifact ? String(reusableArtifact.workflow_run.id) : '');
            core.setOutput('artifact_reused', reusableArtifact ? 'true' : 'false');

            const checkRun = await github.rest.checks.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: 'PR LLVM test suite',
              head_sha: pullRequest.head.sha,
              status: 'queued',
              external_id: requestId,
              details_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              output: {
                title: 'PR LLVM test suite queued',
                summary: reusableArtifact
                  ? 'Reusing an existing PR ELD toolset artifact.'
                  : 'Building the PR ELD toolset before running the LLVM test suite.',
              },
            });
            core.setOutput('check_run_id', String(checkRun.data.id));

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: reusableArtifact
                ? `LLVM test suite request accepted for \`${pullRequest.head.sha}\`. Reusing the existing PR toolset artifact and starting the test job.`
                : `LLVM test suite request accepted for \`${pullRequest.head.sha}\`. Build and test jobs are starting in this workflow run.`,
            });

  build:
    needs: validate
    if: needs.validate.outputs.pr_sha != '' && needs.validate.outputs.artifact_reused != 'true'
    uses: ./.github/workflows/build-pr-toolset.yml
    with:
      pr_number: ${{ needs.validate.outputs.pr_number }}
      pr_sha: ${{ needs.validate.outputs.pr_sha }}
      request_id: ${{ needs.validate.outputs.request_id }}
    permissions:
      contents: read
      actions: write
      pull-requests: read

  test:
    needs: [validate, build]
    if: |
      always() &&
      needs.validate.outputs.pr_sha != '' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    uses: ./.github/workflows/llvm-test-suite-pr.yml
    with:
      pr_number: ${{ needs.validate.outputs.pr_number }}
      pr_sha: ${{ needs.validate.outputs.pr_sha }}
      build_run_id: ${{ needs.build.outputs.artifact_run_id || needs.validate.outputs.artifact_run_id }}
      artifact_name: ${{ needs.build.outputs.artifact_name || needs.validate.outputs.artifact_name }}
    permissions:
      contents: read
      actions: read

  report:
    needs: [validate, build, test]
    if: always() && needs.validate.outputs.pr_sha != ''
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      checks: write
    steps:
      - name: Report workflow result on the PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        env:
          PR_NUMBER: ${{ needs.validate.outputs.pr_number }}
          PR_SHA: ${{ needs.validate.outputs.pr_sha }}
          BUILD_RESULT: ${{ needs.build.result }}
          TEST_RESULT: ${{ needs.test.result }}
          CHECK_RUN_ID: ${{ needs.validate.outputs.check_run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          github-token: ${{ github.token }}
          script: |
            const buildResult = process.env.BUILD_RESULT;
            const testResult = process.env.TEST_RESULT;
            let message;
            if (buildResult === 'failure' || buildResult === 'cancelled') {
              message = `❌ PR ELD toolset build failed for \`${process.env.PR_SHA}\`.`;
            } else if (testResult === 'success') {
              message = `✅ LLVM test suite passed for \`${process.env.PR_SHA}\`.`;
            } else {
              message = `❌ LLVM test suite failed for \`${process.env.PR_SHA}\`.`;
            }

            const conclusion = buildResult === 'success' && testResult === 'success'
              ? 'success'
              : 'failure';
            await github.rest.checks.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_RUN_ID),
              status: 'completed',
              conclusion,
              details_url: process.env.RUN_URL,
              output: {
                title: message,
                summary: `Build result: ${buildResult}. Test result: ${testResult}.`,
              },
            });

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.PR_NUMBER),
              body: `${message} [View workflow run](${process.env.RUN_URL}).`,
            });

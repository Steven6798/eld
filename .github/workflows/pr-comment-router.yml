name: PR comment router
run-name: "PR comment router #${{ github.event.issue.number }}"

on:
  issue_comment:
    types: [created, edited]

concurrency:
  group: pr-comment-router-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: write
  actions: write

jobs:
  route:
    # Restore the upstream-only gate before merging this workflow upstream:
    # if: github.repository == 'qualcomm/eld' &&
    #     github.event.issue.pull_request != null
    if: |
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    steps:
      - name: Route comment request
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 #v9.0.0
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        with:
          github-token: ${{ github.token }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueNumber = context.issue.number;
            const command = process.env.COMMENT_BODY.trim();
            const allowed = new Set(['COLLABORATOR', 'MEMBER', 'OWNER']);

            if (command !== 'check-llvm-test-suite' ||
                !allowed.has(context.payload.comment.author_association)) {
              core.info('Ignoring unrelated or unauthorized comment.');
              return;
            }

            const pullRequest = (await github.rest.pulls.get({
              owner,
              repo,
              pull_number: issueNumber,
            })).data;
            const buildUrl = `${context.serverUrl}/${owner}/${repo}/actions/workflows/build-pr-toolset.yml`;
            let buildRun;

            try {
              const requestId = `${issueNumber}-${pullRequest.head.sha}-${context.payload.comment.id}`;
              const artifactName = `pr-eld-toolset-${pullRequest.head.sha}`;
              const runName = `Build PR #${issueNumber} @${pullRequest.head.sha} (${requestId})`;
              const dispatchedAt = Date.now();

              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'build-pr-toolset.yml',
                ref: context.payload.repository.default_branch,
                inputs: {
                  pr_number: String(issueNumber),
                  pr_sha: pullRequest.head.sha,
                  request_id: requestId,
                },
              });

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `LLVM test suite request accepted for \`${pullRequest.head.sha}\`. Building the PR toolset: [workflow](${buildUrl}).`,
              });

              const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
              for (let attempt = 0; attempt < 120; attempt += 1) {
                const runs = await github.paginate(
                  github.rest.actions.listWorkflowRuns,
                  {
                    owner,
                    repo,
                    workflow_id: 'build-pr-toolset.yml',
                    event: 'workflow_dispatch',
                    per_page: 100,
                  }
                );
                buildRun = runs
                  .filter(run =>
                    run.display_title === runName &&
                    new Date(run.created_at).getTime() >= dispatchedAt - 5000
                  )
                  .sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];

                if (buildRun?.status === 'completed') {
                  break;
                }
                if (attempt < 119) {
                  await sleep(30000);
                }
              }

              if (!buildRun || buildRun.status !== 'completed' || buildRun.conclusion !== 'success') {
                const conclusion = buildRun?.conclusion || 'timed out';
                throw new Error(`PR toolset build did not succeed (${conclusion}).`);
              }

              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'llvm-test-suite-pr.yml',
                ref: context.payload.repository.default_branch,
                inputs: {
                  pr_number: String(issueNumber),
                  pr_sha: pullRequest.head.sha,
                  build_run_id: String(buildRun.id),
                  artifact_name: artifactName,
                },
              });

              const testUrl = `${context.serverUrl}/${owner}/${repo}/actions/workflows/llvm-test-suite-pr.yml`;
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: `PR toolset built successfully. LLVM test suite started: [workflow](${testUrl}).`,
              });
            } catch (error) {
              const message = error instanceof Error ? error.message : String(error);
              const runUrl = buildRun?.html_url || buildUrl;
              try {
                await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: issueNumber,
                  body: [
                    `❌ LLVM test suite request failed for \`${pullRequest.head.sha}\`.`,
                    '',
                    `Build workflow: [view run](${runUrl})`,
                    '',
                    `Reason: ${message}`,
                  ].join('\n'),
                });
              } catch (commentError) {
                core.warning(`Could not post failure comment: ${commentError}`);
              }
              core.setFailed(message);
            }
